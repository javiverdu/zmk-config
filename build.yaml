# Matriz de builds para GitHub Actions.
#
# Modo dongle: un tercer nice_nano_v2 hace de central y las dos mitades pasan
# a perifericas. KeyPeek (raw_hid_adapter + ZMK Studio) va en el dongle, que
# es quien habla con el PC.
#
# Sin dongle: comenta el bloque DONGLE y descomenta el bloque SIN DONGLE.
---
include:
  ### MODO DONGLE
  - board: nice_nano_v2
    shield: corne_dongle dongle_display raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_dongle
  - board: nice_nano_v2
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_left_peripheral
  - board: nice_nano_v2
    shield: corne_right
    artifact-name: corne_right_peripheral

  ### SIN DONGLE (mitad izquierda central, KeyPeek en la izquierda)
#  - board: nice_nano_v2
#    shield: corne_left raw_hid_adapter
#    snippet: studio-rpc-usb-uart
#    cmake-args: -DCONFIG_ZMK_STUDIO=y
#    artifact-name: corne_left_central
#  - board: nice_nano_v2
#    shield: corne_right
#    artifact-name: corne_right

