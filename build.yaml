# Matriz de builds para GitHub Actions.
#
# Modo dongle: un tercer nice_nano_v2 hace de central y las dos mitades pasan
# a perifericas. KeyPeek (raw_hid_adapter + ZMK Studio) va en el dongle, que
# es quien habla con el PC.
#
# Sin dongle: comenta el bloque DONGLE y descomenta el bloque SIN DONGLE.
---
include:
  ### MODO DONGLE
  - board: nice_nano_v2
    shield: corne_dongle dongle_display raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_dongle

  # Las dos de abajo solo hacen falta si corne_dongle sigue saliendo con ruido.
  # Aislan la causa sin tener que flashear a ciegas otra vez.

  # Bongocat sin raw HID ni Studio, y con log por USB.
  #   - se ve bien   -> el problema es raw HID / Studio compartiendo recursos
  #   - sigue mal    -> conectar por serie y leer el error de verdad
  #                     (LVGL assert, stack overflow, fallo de I2C)
  #
  # El log va por el snippet zmk-usb-logging, no por -DCONFIG_ZMK_USB_LOGGING=y:
  # ese symbol a secas selecciona USB_CDC_ACM y UART_CONSOLE sin SERIAL ni el
  # nodo zephyr,cdc-acm-uart en devicetree, y el build aborta. El snippet trae
  # las dos cosas.
  - board: nice_nano_v2
    shield: corne_dongle dongle_display
    snippet: zmk-usb-logging
    artifact-name: corne_dongle_nostudio

  # Pantalla de estado interna de ZMK sobre el mismo nodo OLED, sin bongocat.
  #   - texto limpio -> panel, driver y cableado correctos, la culpa es de
  #                     dongle_display / LVGL
  #   - ruido igual  -> mirar hardware: I2C, cables, alimentacion del panel
  - board: nice_nano_v2
    shield: corne_dongle
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
    artifact-name: corne_dongle_probe

  - board: nice_nano_v2
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_left_peripheral
  - board: nice_nano_v2
    shield: corne_right
    artifact-name: corne_right_peripheral

  ### SIN DONGLE (mitad izquierda central, KeyPeek en la izquierda)
#  - board: nice_nano_v2
#    shield: corne_left raw_hid_adapter
#    snippet: studio-rpc-usb-uart
#    cmake-args: -DCONFIG_ZMK_STUDIO=y
#    artifact-name: corne_left_central
#  - board: nice_nano_v2
#    shield: corne_right
#    artifact-name: corne_right

  ### Borrado de emparejamientos (flashear si las mitades no se encuentran)
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
