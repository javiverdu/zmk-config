# Config del dongle.
#
# ZMK parte el nombre del shield y aplica tambien config/corne.conf a este
# build, antes que este fichero. Por eso aqui se reponen los valores que
# corne.conf fija para las mitades y que no valen para el dongle.

### Rol
# Dos perifericos: mitad izquierda y mitad derecha.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# 2 mitades + 3 perfiles de host.
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

### Pantalla
CONFIG_ZMK_DISPLAY=y

# corne.conf lo pone a n. dongle_display sustituye la pantalla de estado por
# la suya (bongocat, capa activa, modificadores), asi que aqui tiene que ir a y.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=y
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=y
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=y

# El dongle va por USB, su bateria no interesa.
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n

### Bateria
# La que se reporta al host debe ser la de las mitades.
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

### Energia
# corne.conf duerme el teclado a los 60 s. El dongle esta enchufado.
CONFIG_ZMK_SLEEP=n
