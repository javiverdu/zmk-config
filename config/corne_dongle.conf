# Config del dongle.
#
# ZMK parte el nombre del shield y aplica tambien config/corne.conf a este
# build, antes que este fichero. Por eso aqui se reponen los valores que
# corne.conf fija para las mitades y que no valen para el dongle.

### Rol
# Dos perifericos: mitad izquierda y mitad derecha.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# 2 mitades + 3 perfiles de host.
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

### Pantalla
CONFIG_ZMK_DISPLAY=y

# corne.conf lo pone a n. dongle_display sustituye la pantalla de estado por
# la suya (bongocat, capa activa, modificadores), asi que aqui tiene que ir a y.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=y
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=y
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=y

# El dongle va por USB, su bateria no interesa.
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n

### Pantalla: lo que dongle_display se deja sin poner
# Sin esto la pantalla sale como ruido ("caos de puntitos").
#
# 1) Tema LVGL. En zmk/app/src/display/Kconfig el tema mono solo entra por la
#    rama de la pantalla interna:
#
#      config ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN
#          imply LV_USE_THEME_MONO if LV_Z_BITS_PER_PIXEL=1
#
#    Con STATUS_SCREEN_CUSTOM no hay ningun tema activo: ni THEME_MONO ni
#    THEME_DEFAULT (comprobado en el Kconfig resuelto del build de CI). El
#    custom_status_screen.c de dongle_display hace lv_obj_create(NULL) y solo le
#    pone estilo de fuente, no fondo, asi que la pantalla queda transparente y
#    el buffer no se limpia entre refrescos parciales (LV_Z_VDB_SIZE=64, sin
#    LV_Z_FULL_REFRESH). Se acaba volcando al panel lo que hubiera en memoria.
#    Las mitades no lo sufren porque usan la pantalla interna y si tienen tema.
CONFIG_LV_USE_THEME_MONO=y

# 2) Pila del hilo de pantalla. dongle_display se queda con el default de ZMK
#    (2048). zmk-nice-oled, que es la otra pantalla custom de 128x64 y si
#    funcionaba en este hardware, sube el valor a proposito:
#
#      config ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE
#          default 3072 if NICE_OLED_WIDGET_RAW_HID && (!ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL)
#          default 2560
#
#    Este build es central y lleva raw HID + Studio, o sea el caso de los 3072.
#    Y no hay HW_STACK_PROTECTION, asi que un desbordamiento corromperia memoria
#    en silencio en vez de dar fault.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

### Bateria
# La que se reporta al host debe ser la de las mitades.
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

### Energia
# corne.conf duerme el teclado a los 60 s. El dongle esta enchufado.
CONFIG_ZMK_SLEEP=n
